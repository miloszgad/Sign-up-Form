<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
 <div class="content">
    <div class="logo-section">
        <img  class="lifs-img" src="lifs.jpg" alt="zdjęcie liści">
        <div class="my-logo">MLO_GD</div>
        <div class="image-author"> Photo by <a href="https://unsplash.com/@haliewestphoto" class="author">Halie West</a> on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA" class="photo-website">Unsplash</a></div>
    </div>

    <div class="content-section">
        <div class="description">
            <p class="text1"> This is not a real online service! You know you need something like this in you life to help you realize your deepest dreams. Sign up <a href="https://github.com/miloszgad" class="login1">now</a> to get started.</p> 
            <p class="text2"> You know you want to. </p>
        </div>
        <div  class="form">
            <form action="" method="get">
                <fieldset>
                    <legend>Let's do this!</legend>
             <div class="columns">
                <div class="column1">
                  <label for="first_name">FIRST NAME:</label>
                  <input type="text" id="first_name" name="first_name" required>    
                  <label for="email">EMAIL:</label>
                  <input type="email" id="email" name="email" required>
                  <label for="password">PASSWORD:</label>
                  <input type="password" id="password" name="password" minlength="6" placeholder="(min. 6 characters)" required>
                </div>
                <div class="column2"> 
                  <label for="last_name">LAST NAME:</label>
                  <input type="text" id="last_name" name="last_name" required>
                  <label for="phone-number">PHONE NAME:</label>
                  <input type="tel" id="phone-number" name="phone_number" pattern="[0-9]{9}" placeholder="(9 digits, no spaces)
                  " required>
                  <label for="conf-password">CONFIRM PASSWORD:  </label>
                  <input type="password" id="conf-password" name="conf-password" minlength="6" required>
                </div>
            </div>
            </fieldset>
           
        </div>
        <div  class="submit">
            <button type="submit">Create Account</button>
             </form> 
            <div class="login-ask">Already have an account? <a href="https://github.com/miloszgad" class="login2">Log in</a></div>
        </div>
    </div>
 </div>
</body>
</html>
